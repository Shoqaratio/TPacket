name: CI
on:
  push:
  pull_request:

jobs:
  engine-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w @netlab/engine
      - run: npm run build -w @netlab/engine
      - run: npm run build -w @netlab/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: netlab }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci && npm run build -w @netlab/engine
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Migrations on PostgreSQL (up, down, up)
        working-directory: apps/api
        env: { NETLAB_DATABASE_URL: "postgresql+psycopg://postgres:ci@localhost:5432/netlab" }
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -q
        working-directory: apps/api
