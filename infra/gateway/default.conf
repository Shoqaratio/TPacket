map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Edge of the stack: the client address is $remote_addr, never a header sent by the client.
    # Behind the school's TLS reverse proxy, trust ONLY that proxy so $remote_addr becomes the real client:
    #   set_real_ip_from 10.0.0.5;     # address of the TLS proxy
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /etc/nginx/conf.d;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location = /maintenance-status.json {
        alias /etc/nginx/maintenance/progress.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        if (-f /etc/nginx/maintenance/maintenance.flag) {
            return 503;
        }

        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        # Overwrite (do not append): a forged X-Forwarded-For from the client is discarded here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
